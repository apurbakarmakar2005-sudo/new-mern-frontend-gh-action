name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  build:
    name: Build Vite Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: http://3.228.103.16
        run: npm run build


  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Frontend to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "========================================="
            echo "FRONTEND DEPLOYMENT STARTED"
            echo "========================================="

            APP_DIR="/var/www/frontend"
            TEMP_DIR="/tmp/frontend-deploy"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R ubuntu:ubuntu "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deployment..."

              rm -rf "$TEMP_DIR"
              mkdir -p "$TEMP_DIR"

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$TEMP_DIR"

              cp -a "$TEMP_DIR"/. "$APP_DIR"/
              rm -rf "$TEMP_DIR"

              cd "$APP_DIR"

            else
              echo "Updating existing frontend..."

              cd "$APP_DIR"

              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd
            fi

            echo "Installing dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            if [ ! -f "$APP_DIR/dist/index.html" ]; then
              echo "ERROR: dist/index.html not found!"
              exit 1
            fi

            echo "Frontend build successful."

            echo "Creating Nginx configuration..."

            sudo rm -f /etc/nginx/sites-enabled/default

            sudo bash -c 'cat > /etc/nginx/sites-available/frontend' <<'NGINX'
server {
    listen 80;
    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://3.228.103.16;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
NGINX

            sudo ln -sf \
              /etc/nginx/sites-available/frontend \
              /etc/nginx/sites-enabled/frontend

            echo "Testing Nginx..."

            sudo nginx -t

            echo "Restarting Nginx..."

            sudo systemctl restart nginx
            sudo systemctl enable nginx

            echo "Checking Nginx status..."

            sudo systemctl is-active nginx

            echo "========================================="
            echo "FRONTEND DEPLOYMENT FINISHED"
            echo "========================================="