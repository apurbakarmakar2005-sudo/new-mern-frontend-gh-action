name: Deploy Frontend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # =================================
  # TEST & BUILD
  # =================================
  build:
    name: Build Vite Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: http://3.228.103.16
        run: npm run build


  # =================================
  # DEPLOY
  # =================================
  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # =================================
      # AWS OIDC
      # =================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      # =================================
      # VERIFY AWS
      # =================================
      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # =================================
      # DEPLOY TO EC2
      # =================================
      - name: Deploy Frontend to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |

            set -e

            echo "========================================="
            echo "FRONTEND DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="


            # =================================
            # VARIABLES
            # =================================

            APP_DIR="/var/www/frontend"
            TEMP_DIR="/tmp/frontend-deploy"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Repository: $REPO_URL"
            echo "Branch: $BRANCH"
            echo "Application directory: $APP_DIR"


            # =================================
            # CREATE APPLICATION DIRECTORY
            # =================================

            sudo mkdir -p "$APP_DIR"
            sudo chown -R ubuntu:ubuntu "$APP_DIR"


            # =================================
            # FIRST DEPLOYMENT
            # =================================

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "First deployment detected."

              rm -rf "$TEMP_DIR"
              mkdir -p "$TEMP_DIR"

              echo "Cloning repository..."

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$TEMP_DIR"

              echo "Copying project files..."

              cp -a "$TEMP_DIR"/. "$APP_DIR"/

              rm -rf "$TEMP_DIR"

              cd "$APP_DIR"

            else

              # =================================
              # UPDATE EXISTING DEPLOYMENT
              # =================================

              echo "Existing repository found."

              cd "$APP_DIR"

              echo "Fetching latest changes..."

              git fetch origin "$BRANCH"

              echo "Resetting to latest GitHub version..."

              git reset --hard "origin/$BRANCH"

              echo "Removing old untracked files..."

              git clean -fd

            fi


            # =================================
            # CHECK PROJECT
            # =================================

            echo "========================================="
            echo "PROJECT FILES"
            echo "========================================="

            ls -la


            # =================================
            # INSTALL DEPENDENCIES
            # =================================

            echo "========================================="
            echo "INSTALLING DEPENDENCIES"
            echo "========================================="

            npm ci


            # =================================
            # BUILD FRONTEND
            # =================================

            echo "========================================="
            echo "BUILDING FRONTEND"
            echo "========================================="

            npm run build


            # =================================
            # CHECK DIST
            # =================================

            echo "========================================="
            echo "CHECKING BUILD"
            echo "========================================="

            if [ ! -f "$APP_DIR/dist/index.html" ]; then
              echo "ERROR: dist/index.html not found!"
              exit 1
            fi

            echo "Frontend build successful."


            # =================================
            # CONFIGURE NGINX
            # =================================

            echo "========================================="
            echo "CONFIGURING NGINX"
            echo "========================================="

            sudo tee /etc/nginx/sites-available/frontend > /dev/null <<'EOF'
server {
    listen 80;
    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://3.228.103.16;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOF


            # =================================
            # ENABLE NGINX SITE
            # =================================

            sudo ln -sf \
              /etc/nginx/sites-available/frontend \
              /etc/nginx/sites-enabled/frontend

            sudo rm -f /etc/nginx/sites-enabled/default


            # =================================
            # TEST NGINX
            # =================================

            echo "Testing Nginx configuration..."

            sudo nginx -t


            # =================================
            # RESTART NGINX
            # =================================

            echo "Restarting Nginx..."

            sudo systemctl restart nginx
            sudo systemctl enable nginx


            # =================================
            # NGINX STATUS
            # =================================

            echo "========================================="
            echo "NGINX STATUS"
            echo "========================================="

            sudo systemctl --no-pager status nginx


            # =================================
            # DEPLOYMENT FINISHED
            # =================================

            echo "========================================="
            echo "FRONTEND DEPLOYMENT FINISHED"
            echo "Time: $(date)"
            echo "========================================="